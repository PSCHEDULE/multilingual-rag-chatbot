[project]
name = "multilingual-rag-chatbot"
version = "0.1.0"
description = "Multilingual RAG customer support chatbot (KO/EN/JA/ZH)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "openai>=1.55.0",
    "python-dotenv>=1.0.0",
    "qdrant-client>=1.12.0",
    "sse-starlette>=2.1.0",
    "llama-index-core>=0.14.23",
    "langdetect>=1.0.9",
    "langgraph>=1.2.9",
    "langchain-core>=1.4.9",
    "ragas>=0.2.0",
    "datasets>=5.0.0",
    "langchain-openai>=1.3.5",
    "langchain-community>=0.3.14,<0.4",
]

[project.scripts]
multilingual-rag-chatbot = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest-mock>=3.15.1",
]
# Optional: BGE-M3 dense embeddings (M8-B Stage 1+). Not required for hash/offline CI.
# Install: uv sync --group bge
bge = [
    "sentence-transformers>=3.3.0,<4",
    "torch>=2.2.0,<3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that need Qdrant or external services",
    "bge: requires optional bge dependency group (sentence-transformers + torch + BGE-M3 weights)",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
packages = ["app"]
